name: Build, Test and Deploy Postgram

on:
  push:
    branches:
      - main

jobs:
  build-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "SECRET_KEY=9secret" > .env
          echo "DATABASE_NAME=test_coredb" >> .env
          echo "DATABASE_USER=test_core" >> .env
          echo "DATABASE_PASSWORD=12345" >> .env
          echo "DATABASE_HOST=db" >> .env
          echo "DATABASE_PORT=5432" >> .env
          echo "POSTGRES_USER=test_core" >> .env
          echo "POSTGRES_PASSWORD=12345" >> .env
          echo "POSTGRES_DB=test_coredb" >> .env
          echo "ENV=TESTING" >> .env
          echo "DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost" >> .env

      - name: Start DB only
        run: docker compose up -d db

      - name: Wait for DB to be ready
        run: sleep 20

      - name: Start API
        run: docker compose up -d api

      - name: Wait for API to be ready
        run: sleep 30

      - name: Show API logs
        run: docker compose logs api

      - name: Run Tests
        run: docker compose exec -T api pytest

      - name: Cleanup
        if: always()
        run: docker compose down

  deploy:
    name: Deploying on EC2 via SSH
    if: ${{ github.event_name == 'push' }}
    needs: [build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploying Application on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_EC2_IP }}
          username: ${{ secrets.SSH_EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd ~/.scripts
            ./docker-ec2-deploy.sh
            
            


