name: Build, Test and Deploy Postgram

on:
  push:
    branches:
      - main

jobs:
  build-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "SECRET_KEY=9secret" > .env
          echo "DATABASE_NAME=test_coredb" >> .env
          echo "DATABASE_PASSWORD=12345" >> .env
          echo "DATABASE_HOST=db" >> .env
          echo "DATABASE_PORT=5432" >> .env
          echo "POSTGRES_USER=test_core" >> .env
          echo "POSTGRES_PASSWORD=12345678" >> .env
          echo "POSTGRES_DB=test_coredb" >> .env
          echo "ENV=TESTING" >> .env
          echo "DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost" >> .env

      - name: Build Containers
        run: docker compose build

      - name: Start Containers
        run: docker compose up -d

      - name: Wait for API and DB
        run: |
          sleep 60
          docker compose ps
          docker compose logs api --tail=20

      - name: Run Tests
        run: docker compose exec -T api pytest

      - name: Cleanup
        if: always()
        run: docker compose down